services:
  # Lightweight cron scheduler that manages container lifecycle
  scheduler:
    image: mcuadros/ofelia:latest
    container_name: simplefin-scheduler
    restart: unless-stopped
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    labels:
      # job-run spins up a new container on schedule, then removes it when done
      ofelia.job-run.sync.schedule: "0 */8 * * *"        # every 8 hours (00:00, 08:00, 16:00 UTC)
      ofelia.job-run.sync.container: simplefin-database-sync
      ofelia.job-run.export.schedule: "15 */8 * * *"
      ofelia.job-run.export.container: simplefin-csv-export

  # The actual database sync job — built from this repo
  database-sync:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sync
    container_name: simplefin-database-sync
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=sqlite:////data/simplefin.db
      - LOOKBACK_DAYS=30
    volumes:
      - type: bind
        source: ./data
        target: /data
    labels:
      ofelia.enabled: "true"

  # Monthly CSV export job — exports transactions to /data/exports then uploads via rclone
  csv-export:
    build:
      context: ..
      dockerfile: docker/Dockerfile.export
    container_name: simplefin-csv-export
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=sqlite:////data/simplefin.db
      - EXPORT_DIR=/data/exports
    volumes:
      - type: bind
        source: ./data
        target: /data
    labels:
      ofelia.enabled: "true"

